
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Aren Mandar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <header class="login-header">
    <h1>AREN MANDAR</h1>
    <p>Katalog Gula Merah Sulawesi Barat</p>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-icon">🍯</div>

      <h2>Selamat Datang!</h2>
      <p class="login-subtitle">
        Masuk untuk menjelajahi produk gula merah lokal.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="pesan" role="alert"></p>

        <button type="submit" class="login-button">
          Login
        </button>
      </form>

      <p class="login-demo">
        Demo UTS: username <b>admin</b>,
        password <b>aren123</b>
      </p>

      <a href="index.html" class="back-link">
        ← Kembali ke Beranda
      </a>
    </div>
  </main>

  <footer class="login-footer">
    <p>&copy; 2026 Aren Mandar</p>
    <p>Manisnya Alam, Kebanggaan Sulawesi Barat</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
